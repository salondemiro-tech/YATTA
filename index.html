<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YATTA 清掃管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginView" class="screen hidden">
  <h1>清掃管理システム YATTA</h1>
  <div class="btnrow" style="justify-content:flex-end"><button id="loginLang">မြန်မာ</button></div>
  <div class="field"><label id="lblEmp">社員番号</label><input id="empNo" inputmode="text" autocomplete="username" autocapitalize="off"></div>
  <div class="field"><label id="lblPw">パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="primary">ログイン</button>
  <p id="loginErr" class="kv"></p>
  <p class="kv">アカウントは管理者が登録します。パスワードを忘れた場合は管理者に連絡してください。</p>
</div>

<div id="appView" class="hidden">
  <header>
    <button id="homeBtn">トップ</button>
    <div class="who"><b id="viewTitle"></b><br><span id="who"></span></div>
    <button id="syncBadge" class="sync ok">同期済み</button>
    <button id="langBtn" class="hidden">မြန်မာ</button>
    <button id="switchBtn" class="hidden">表示切替</button>
    <button id="setBtn">⚙</button>
  </header>

  <section id="v-home" class="view"><div id="homeBody"></div></section>

  <section id="v-sched" class="view hidden">
    <div class="bar"><span class="lbl">日付</span><div class="seg targetSeg" id="schedTarget"></div><button id="draftBtn">前日から下書き</button></div>
    <div class="bar">
      <span class="lbl">ペン</span>
      <div class="seg" id="penSeg"><button data-pen="red" class="pen-red">赤 連泊清掃</button><button data-pen="co" class="pen-co">赤 C/O</button><button data-pen="green" class="pen-green">緑 清掃なし</button><button data-pen="yellow" class="pen-yellow">黄 未清掃・清掃不要</button><button data-pen="erase" class="pen-erase">消す</button></div>
    </div>
    <div class="bar"><input id="rangeIn" placeholder="まとめて塗る 例: 201-215, 310"><button id="rangeBtn">塗る</button></div>
    <div class="summary" id="schedSum"></div>
    <div class="bar floorbar" id="schedFloors"></div>
    <div class="legend">ペンを選んで部屋をタップ。同じペンでもう一度タップすると未入力（灰）に戻ります。C/O の部屋は、フロント・管理課どちらの画面にも「C/O」と表示されます。黄は「チェックアウト済み・今日は清掃しない部屋」（翌日の下書きで赤 C/O になります）。白は管理課が完了済み。</div>
    <div id="schedBoard"></div>
  </section>

  <section id="v-spin" class="view hidden">
    <div class="card">
      <div class="field"><label>対応日</label><div class="seg targetSeg" id="spinTarget"></div></div>
      <div class="field"><label>部屋番号（複数可 例: 201, 305）</label><input id="spRoom"></div>
      <div class="field"><label>特別対応の内容（お客様の氏名は書かない）</label><textarea id="spText" rows="3" placeholder="例：アメニティ2名分追加"></textarea></div>
      <button id="spAdd" class="primary">指示を追加</button>
    </div>
    <div id="spinList"></div>
  </section>

  <section id="v-board" class="view hidden">
    <div class="summary" id="boardSum"></div>
    <div class="bar floorbar" id="boardFloors"></div>
    <div class="legend" id="boardLegend"></div>
    <div id="boardGrid"></div>
  </section>

  <section id="v-report" class="view hidden"><div id="reportList"></div></section>

  <section id="v-hist" class="view hidden">
    <div class="bar"><input type="date" id="histDate" style="flex:0 1 auto;min-width:0"><input id="histRoom" placeholder="部屋番号" style="flex:0 1 110px;min-width:0"><button id="histRoomBtn">操作履歴</button></div>
    <div class="summary" id="histSum"></div>
    <div class="bar floorbar" id="histFloors"></div>
    <div class="legend" id="histLegend"></div>
    <div id="histBody" class="list"></div>
  </section>
</div>

<div id="settingsView" class="screen hidden">
  <h1 id="setTitle">設定</h1>
  <h3 class="sh" id="acctTitle">アカウント</h3>
  <p class="kv" id="acctInfo"></p>
  <div class="btnrow"><button id="pwBtn">パスワード変更</button><button id="logoutBtn">ログアウト</button></div>

  <div id="adminSec" class="hidden">
    <h3 class="sh">部屋番号（管理者）</h3>
    <div class="field"><label>1行に1フロア「階: 部屋番号」。範囲は「-」、区切りは「,」</label>
      <textarea id="roomsTa" rows="10" placeholder="2: 201-230&#10;3: 301-330, 335"></textarea></div>
    <div class="field"><label>部屋タイプ（1行に1タイプ「タイプ: 部屋番号」。タイプは S・D・T・TR。未設定の部屋は空欄で可）</label>
      <textarea id="typesTa" rows="5" placeholder="S: 201-210&#10;D: 211-220&#10;T: 221-240&#10;TR: 241-244"></textarea></div>
    <p class="kv" id="setInfo"></p>
    <button id="setSave" class="primary">部屋番号・タイプを保存</button>

    <h3 class="sh">社員の登録（管理者）</h3>
    <div class="card0">
      <div class="field"><label>社員番号（ログインID）</label><input id="uNo" autocapitalize="off"></div>
      <div class="field"><label>名前（画面と履歴に表示）</label><input id="uName"></div>
      <div class="field"><label>所属</label><select id="uDept"><option value="front">フロント</option><option value="hk">管理課</option></select></div>
      <label class="chk"><input type="checkbox" id="uAdmin"> 管理者にする</label>
      <div class="field"><label>初期パスワード（6文字以上。本人にログイン後の変更を依頼）</label><input id="uPw" autocomplete="new-password"></div>
      <button id="uAdd" class="primary">登録</button>
    </div>
    <div id="userList"></div>
  </div>

  <div class="btnrow" style="margin-top:20px"><button id="setCancel">戻る</button></div>
</div>

<div id="sheetBg" class="sheet-bg hidden"><div class="sheet" id="sheet"></div></div>
<div id="dlgBg" class="dlg-bg hidden"><div class="dlg"><p id="dlgMsg"></p><div class="row"><button id="dlgCancel">キャンセル</button><button id="dlgOk" class="primary">OK</button></div></div></div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
